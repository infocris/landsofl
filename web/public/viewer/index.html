<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lands of Lore 3D</title>
<style>
  :root { --fg: #e8dcc0; --muted: #a39578; --gold: #c9a227; --panel: rgba(12, 10, 8, .78); }
  html, body { margin: 0; height: 100%; background: #000; color: var(--fg);
    font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
  #view { position: fixed; inset: 0; width: 100vw; height: 100vh; object-fit: contain; background: #000;
    image-rendering: pixelated; image-rendering: crisp-edges; cursor: crosshair; }
  /* vue intégrée sous le jeu : pixels 1,2 fois plus hauts que larges, comme le jeu (320 × 200
     affiché en 4:3) ; 352 × 240 rendus, affichés au format 352 × 288 */
  html.embed #view { inset: auto; left: 50%; top: 50%; transform: translate(-50%, -50%); object-fit: fill;
    width: min(100vw, calc(100vh * 352 / 288)); height: min(100vh, calc(100vw * 288 / 352)); }
  #scene { position: fixed; inset: 0; background: #000; display: flex; align-items: center; justify-content: center; }
  #scene[hidden] { display: none; }
  #scene img { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; }
  #scene-label { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); color: var(--gold);
    background: var(--panel); border: 1px solid #554a36; border-radius: 6px; padding: 4px 10px;
    font-weight: 600; letter-spacing: .05em; }
  #scene-label:empty { display: none; }
  #map { position: fixed; top: 12px; right: 12px; image-rendering: pixelated;
    border: 1px solid #554a36; background: #000; }
  .panel { position: fixed; background: var(--panel); border: 1px solid #554a36;
    border-radius: 6px; padding: 8px 10px; }
  #top { top: 12px; left: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    max-width: calc(100vw - 200px); }
  #top select, #top button { background: #1d1912; color: var(--fg); border: 1px solid #554a36;
    border-radius: 4px; padding: 3px 6px; font: inherit; }
  #top select { max-width: min(340px, 60vw); text-overflow: ellipsis; }
  #where { color: var(--muted); }
  #label { left: 50%; transform: translateX(-50%); bottom: 64px; color: var(--gold);
    font-weight: 600; letter-spacing: .05em; display: none; }
  #help { left: 12px; bottom: 12px; color: var(--muted); font-size: 12px; }
  #help b { color: var(--fg); font-weight: 600; }
  #help.hidden { display: none; }
  @media (max-width: 600px) { #map { width: 128px; height: 128px; } #help { display: none; } }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="scene" hidden><img alt=""><div id="scene-label"></div></div>
<canvas id="map" width="160" height="160"></canvas>
<div id="top" class="panel">
  <select id="level" aria-label="Niveau"></select>
  <span id="where"></span>
</div>
<div id="label" class="panel"></div>
<div id="help" class="panel">
  <b>Z/S</b> avancer/reculer · <b>Q/D</b> tourner · <b>A/E</b> pas de côté · flèches aussi ·
  <b>Maj</b> courir · clic = souris pour regarder (Échap pour libérer) ·
  <b>Espace</b> ouvrir/fermer une porte · <b>N</b> traverser les murs · <b>M</b> carte · <b>H</b> aide
</div>
<script src="viewer.js?v=20261123t"></script>
</body>
</html>
